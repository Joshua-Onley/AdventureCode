services:
  postgres:
    image: postgres:15-alpine
    container_name: adventurecode_postgres
    environment:
      POSTGRES_USER: adventurecode_user
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: adventurecode_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adventurecode_user -d adventurecode_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adventurecode_backend
    env_file:
      - .env.development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data: